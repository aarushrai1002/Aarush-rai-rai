<!DOCTYPE html>
<html>
<head>
    <style>
        /* Top Box (Teal) */
        .box-1 {
            width: 250px;
            background-color: #5e9e9f;
            border: 10px solid black;
            padding: 20px; /* 20px Padding */
        }

        /* Middle Box (Yellow) */
        .box-2 {
            width: 250px;
            height: 250px;
            background-color: yellow;
            margin-left: 270px; /* Corner to Corner milaane ke liye */
            border-top: 20px solid black; /* 20px Top Border */
            border-bottom: 20px solid black; /* 20px Bottom Border */
            border-left: 10px solid black; /* 10px Side Border */
            border-right: 10px solid black;
        }

        /* Bottom Box (Red) */
        .box-3 {
            width: 250px;
            height: 250px;
            background-color: #cd5c5c;
            border: 10px solid black;
        }
    </style>
</head>
<body>

    <div class="box-1">
        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Aliquam at sapien porttitor urna elementum lacinia. In id magna pulvinar, ultricies lorem id, vehicula elit.
    </div>

    <div class="box-2"></div>

    <div class="box-3"></div>

</body>
</html>
